<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Lista Studenti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">Studenti Registrati</h1>

    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-primary">
          <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Data Nascita</th>
            <th>Email</th>
            <th>Corso</th>
          </tr>
        </thead>
        <tbody id="tabella"></tbody>
      </table>
    </div>
  </div>

  <script>
    fetch('http://localhost:5000/studenti')
      .then(res => res.json())
      .then(studenti => {
        const tbody = document.querySelector('#tabella');
        studenti.forEach(s => {
          const riga = `<tr>
            <td>${s.nome}</td>
            <td>${s.cognome}</td>
            <td>${s.data_nascita}</td>
            <td>${s.email}</td>
            <td>${s.corso}</td>
          </tr>`;
          tbody.innerHTML += riga;
        });
      });
  </script>
</body>
</html>
