<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Registrazione Studente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 500px; width: 100%;">
      <h2 class="text-center mb-4">Registrazione Studente</h2>
      <form id="form">
        <div class="mb-3">
          <input type="text" id="nome" class="form-control" placeholder="Nome" required />
        </div>
        <div class="mb-3">
          <input type="text" id="cognome" class="form-control" placeholder="Cognome" required />
        </div>
        <div class="mb-3">
          <input type="date" id="dataNascita" class="form-control" required />
        </div>
        <div class="mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" required />
        </div>
        <div class="mb-3">
          <select id="corso" class="form-select" required>
            <option value="">Seleziona un corso</option>
            <option value="Informatica">Informatica</option>
            <option value="Economia">Economia</option>
            <option value="Medicina">Medicina</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Invia</button>
      </form>
      <p id="messaggio" class="mt-3 text-center text-success"></p>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();

      const studente = {
        nome: document.getElementById('nome').value,
        cognome: document.getElementById('cognome').value,
        dataNascita: document.getElementById('dataNascita').value,
        email: document.getElementById('email').value,
        corso: document.getElementById('corso').value
      };

      fetch('http://localhost:5000/registrati', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(studente)
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('messaggio').textContent = data.message || data.error;
      });
    });
  </script>
</body>
</html>
